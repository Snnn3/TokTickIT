services:
  db:
    image: postgres:17-alpine
    container_name: toktickit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: toktickit
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d toktickit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
